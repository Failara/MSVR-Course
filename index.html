<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PA#4 - AR.js Neovius Surface</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="main.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker type="pattern" url="marker.patt">
        <a-entity scale="0.3 0.3 0.3" rotation="-90 0 0">
          <a-entity
            geometry="primitive: neovius; steps: 30"
            material="color: #333333; polygonOffset: true; polygonOffsetFactor: 1; polygonOffsetUnits: 1"
          ></a-entity>
          <a-entity
            geometry="primitive: neovius; steps: 30"
            material="color: #ffffff; wireframe: true"
          ></a-entity>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
